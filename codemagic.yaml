workflows:
  android-workflow:
    name: Sanju Tools Hub APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Check project files
        script: |
          ls -la
          ls -la gradle/wrapper
      - name: Build APK
        script: |
          brew install gradle
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
