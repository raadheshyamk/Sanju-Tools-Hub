workflows:
  android-workflow:
    name: Sanju Tools Hub APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Check project files
        script: |
          echo "Checking Android project..."
          ls -la
          ls -la gradle/wrapper
          ls -la app

      - name: Prepare Gradle Wrapper
        script: |
          if [ ! -f gradlew ]; then
            brew install gradle
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Build Debug APK
        script: |
          ./gradlew --no-configuration-cache assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/*.apk
