workflows:
  android-workflow:
    name: Sanju Tools Hub APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Check project
        script: |
          ls -la
          ls -la app

      - name: Prepare Gradle
        script: |
          if [ ! -f gradlew ]; then
            brew install gradle
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Create Debug Keystore
        script: |
          keytool -genkeypair -noprompt \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        script: |
          ./gradlew --no-configuration-cache assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/*.apk
